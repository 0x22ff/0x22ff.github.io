<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
  <title id="t">Bulkhead와 Resilience4j 모듈 조합 순서</title>
  <desc id="d">Bulkhead, TimeLimiter, Retry, Circuit Breaker를 자원 보호 관점으로 조합하는 흐름</desc>
  <defs>
    <style>
      .bg{fill:#f6f9ff}
      .box{fill:#fff;stroke:#cad8ec;stroke-width:2;rx:16;ry:16}
      .focus{fill:#e9f5f2;stroke:#6fb4a6;stroke-width:3;rx:16;ry:16}
      .h{font:700 28px 'Pretendard','Segoe UI',sans-serif;fill:#22314f}
      .t{font:500 19px 'Pretendard','Segoe UI',sans-serif;fill:#334155}
      .m{font:700 20px 'Pretendard','Segoe UI',sans-serif;fill:#22675c}
      .line{stroke:#7f9fda;stroke-width:3;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#7f9fda"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="680"/>
  <text x="70" y="76" class="h">자원 보호를 먼저 보는 조합 순서</text>

  <rect class="box" x="80" y="180" width="190" height="118"/>
  <text x="135" y="226" class="m">Request</text>
  <text x="116" y="258" class="t">호출 시작</text>

  <rect class="focus" x="345" y="180" width="190" height="118"/>
  <text x="390" y="226" class="m">Bulkhead</text>
  <text x="376" y="258" class="t">동시성 제한</text>

  <rect class="box" x="610" y="180" width="190" height="118"/>
  <text x="646" y="226" class="m">TimeLimiter</text>
  <text x="640" y="258" class="t">대기 시간 제한</text>

  <rect class="box" x="875" y="180" width="190" height="118"/>
  <text x="925" y="226" class="m">Retry</text>
  <text x="904" y="258" class="t">제한적 재시도</text>

  <path class="line" d="M270 239 L345 239"/>
  <path class="line" d="M535 239 L610 239"/>
  <path class="line" d="M800 239 L875 239"/>

  <rect class="box" x="345" y="410" width="455" height="122"/>
  <text x="390" y="460" class="m">Circuit Breaker</text>
  <text x="390" y="496" class="t">실패율/느린 호출 비율이 높아지면 차단</text>
  <path class="line" d="M970 298 C970 365 805 360 755 410"/>

  <text x="92" y="612" class="t">핵심: Retry가 Bulkhead 포화를 다시 증폭하지 않도록 retry 대상 예외를 좁게 잡는다.</text>
</svg>
