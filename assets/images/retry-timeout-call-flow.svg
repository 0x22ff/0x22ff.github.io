<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
  <title id="t">Retry and Timeout Call Flow</title>
  <desc id="d">Call flow with TimeLimiter and Retry layers</desc>
  <defs>
    <style>
      .bg{fill:#f6f9ff}
      .box{fill:#fff;stroke:#cad8ec;stroke-width:2;rx:14;ry:14}
      .h{font:700 26px 'Pretendard','Segoe UI',sans-serif;fill:#22314f}
      .t{font:500 19px 'Pretendard','Segoe UI',sans-serif;fill:#304060}
      .m{font:700 17px 'JetBrains Mono',monospace;fill:#3759a6}
      .line{stroke:#7f9fda;stroke-width:3;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#7f9fda"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="700"/>
  <text x="70" y="74" class="h">Request flow with Timeout + Retry policy</text>

  <rect class="box" x="90" y="170" width="240" height="120"/>
  <text x="160" y="218" class="m">Request</text>
  <text x="136" y="248" class="t">incoming call</text>

  <rect class="box" x="410" y="170" width="240" height="120"/>
  <text x="456" y="218" class="m">TimeLimiter</text>
  <text x="444" y="248" class="t">attempt timeout</text>

  <rect class="box" x="730" y="170" width="240" height="120"/>
  <text x="808" y="218" class="m">Retry</text>
  <text x="764" y="248" class="t">limited attempts</text>

  <path class="line" d="M330 230 L410 230"/>
  <path class="line" d="M650 230 L730 230"/>

  <rect class="box" x="90" y="390" width="880" height="200"/>
  <text x="126" y="452" class="m">Decision</text>
  <text x="126" y="486" class="t">- if timeout/temporary failure and retryable -> retry until maxAttempts</text>
  <text x="126" y="520" class="t">- if non-retryable -> fail fast</text>
  <text x="126" y="554" class="t">- after max attempts -> fallback or propagated error</text>
</svg>
