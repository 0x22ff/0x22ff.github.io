<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">Kafka Consumer RateLimiter Configuration</title>
  <desc id="d">Resilience4j rate limiter config and consumer settings for one message per second</desc>
  <defs>
    <style>
      .bg{fill:#f5f8ff}
      .card{fill:#fff;stroke:#ccd8ee;stroke-width:2;rx:16;ry:16}
      .h{font:700 30px 'Pretendard','Segoe UI',sans-serif;fill:#1f2b45}
      .s{font:600 21px 'Pretendard','Segoe UI',sans-serif;fill:#30415f}
      .m{font:600 18px 'JetBrains Mono',monospace;fill:#3659a9}
      .t{font:500 18px 'Pretendard','Segoe UI',sans-serif;fill:#415472}
      .line{stroke:#7f9fda;stroke-width:3;fill:none;marker-end:url(#arr)}
    </style>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#7f9fda"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="760"/>
  <text x="70" y="80" class="h">Configuration map for 1 msg/sec consumer</text>

  <rect class="card" x="70" y="130" width="520" height="560"/>
  <text x="110" y="182" class="s">application.yml</text>
  <text x="110" y="230" class="m">resilience4j.ratelimiter.instances.kafkaWorker</text>
  <text x="110" y="266" class="m">limitForPeriod: 1</text>
  <text x="110" y="302" class="m">limitRefreshPeriod: 1s</text>
  <text x="110" y="338" class="m">timeoutDuration: 0</text>

  <text x="110" y="402" class="m">spring.kafka.listener.ack-mode: manual</text>
  <text x="110" y="438" class="m">spring.kafka.listener.concurrency: 1</text>
  <text x="110" y="474" class="m">spring.kafka.consumer.max-poll-records: 1</text>

  <text x="110" y="536" class="t">- timeoutDuration 0: permit 없으면 즉시 실패 처리</text>
  <text x="110" y="570" class="t">- concurrency 1: 전체 처리량 예측 가능하게 유지</text>
  <text x="110" y="604" class="t">- max-poll-records 1: batch 급증으로 인한 burst 방지</text>

  <rect class="card" x="650" y="130" width="480" height="240"/>
  <text x="688" y="182" class="s">Permit formula</text>
  <text x="688" y="236" class="m">throughput ~= limitForPeriod / limitRefreshPeriod</text>
  <text x="688" y="284" class="m">1 / 1s = 1 msg/sec</text>
  <text x="688" y="332" class="t">인스턴스 수가 늘어나면 총합 처리량도 함께 증가</text>

  <rect class="card" x="650" y="410" width="480" height="280"/>
  <text x="688" y="462" class="s">Operational note</text>
  <text x="688" y="512" class="t">- 파티션 6개 + 인스턴스 3개면 리밋 합계 계산 먼저</text>
  <text x="688" y="548" class="t">- 너무 낮게 잡으면 lag가 계속 쌓임</text>
  <text x="688" y="584" class="t">- 처리 지연 허용 범위와 SLA를 같이 보고 결정</text>
  <text x="688" y="620" class="t">- 재처리 정책(DLT/Retry Topic)까지 같이 설계</text>

  <path class="line" d="M590 250 L650 250"/>
  <path class="line" d="M590 520 L650 520"/>
</svg>
