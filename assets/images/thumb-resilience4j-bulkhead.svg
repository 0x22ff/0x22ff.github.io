<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">Resilience4j Bulkhead 운영 가이드</title>
  <desc id="d">외부 API 장애를 격리하는 Bulkhead 운영 글의 썸네일</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf7f5"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <style>
      .title{font:700 48px 'Pretendard','Segoe UI',sans-serif;fill:#1f2a44}
      .sub{font:600 24px 'Pretendard','Segoe UI',sans-serif;fill:#526070}
      .box{fill:#fff;stroke:#c8d9df;stroke-width:2;rx:14;ry:14}
      .zone{fill:#e8f5f2;stroke:#6fb4a6;stroke-width:3;rx:16;ry:16}
      .mono{font:700 22px 'Pretendard','Segoe UI',sans-serif;fill:#22675c}
      .line{stroke:#6fb4a6;stroke-width:3;fill:none;marker-end:url(#arr)}
      .wall{stroke:#2f6f66;stroke-width:6;stroke-linecap:round}
    </style>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#6fb4a6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>
  <rect x="72" y="78" width="1056" height="476" class="box"/>

  <text x="130" y="190" class="title">Bulkhead</text>
  <text x="130" y="234" class="sub">Resilience4j 장애 격리 운영 가이드</text>

  <rect x="130" y="330" width="210" height="86" class="zone"/>
  <text x="196" y="382" class="mono">주문</text>
  <line x1="378" y1="316" x2="378" y2="432" class="wall"/>

  <rect x="430" y="330" width="210" height="86" class="zone"/>
  <text x="484" y="382" class="mono">외부 API</text>
  <line x1="678" y1="316" x2="678" y2="432" class="wall"/>

  <rect x="730" y="330" width="210" height="86" class="zone"/>
  <text x="796" y="382" class="mono">조회</text>

  <path d="M340 373 L430 373" class="line"/>
  <path d="M640 373 L730 373" class="line"/>
  <text x="130" y="482" class="sub">느린 의존성이 전체 자원을 잡아먹지 않게 제한한다</text>
</svg>
