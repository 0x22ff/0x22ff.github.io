<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
  <title id="t">정책 정리 전 장애가 커지던 흐름</title>
  <desc id="d">긴 대기와 무분별한 retry가 장애를 증폭시키는 패턴</desc>
  <defs>
    <style>
      .bg{fill:#f7fbff}
      .box{fill:#fff;stroke:#cfdcef;stroke-width:2;rx:14;ry:14}
      .bad{fill:#fff2f2;stroke:#e8b0b0}
      .h{font:700 25px 'Pretendard','Segoe UI',sans-serif;fill:#23314e}
      .t{font:500 18px 'Pretendard','Segoe UI',sans-serif;fill:#334663}
      .m{font:700 18px 'Pretendard','Segoe UI',sans-serif;fill:#3659a7}
      .line{stroke:#7ea0da;stroke-width:3;fill:none;marker-end:url(#arr)}
    </style>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#7ea0da"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="680"/>
  <text x="70" y="74" class="h">정책 정리 전 장애가 커지던 흐름</text>

  <rect class="box" x="90" y="160" width="260" height="130"/>
  <text x="144" y="214" class="m">클라이언트 요청</text>
  <text x="128" y="244" class="t">트래픽 증가 시작</text>

  <rect class="box bad" x="470" y="160" width="260" height="130"/>
  <text x="528" y="214" class="m">다운스트림 API</text>
  <text x="518" y="244" class="t">지연 + timeout 증가</text>

  <rect class="box bad" x="850" y="160" width="260" height="130"/>
  <text x="936" y="214" class="m">Retry 폭증</text>
  <text x="892" y="244" class="t">호출 수가 더 커짐</text>

  <path class="line" d="M350 225 L470 225"/>
  <path class="line" d="M730 225 L850 225"/>

  <rect class="box" x="90" y="370" width="1020" height="230"/>
  <text x="126" y="432" class="m">관측된 증상</text>
  <text x="126" y="466" class="t">- p95/p99 지연이 빠르게 튄다</text>
  <text x="126" y="500" class="t">- worker thread가 예상보다 오래 붙잡힌다</text>
  <text x="126" y="534" class="t">- retry가 총 호출 수를 늘려 복구를 더 늦춘다</text>
</svg>
