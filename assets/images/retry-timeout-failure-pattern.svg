<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
  <title id="t">Failure Pattern Without Retry Timeout Policy</title>
  <desc id="d">How unbounded retries and long waits amplify incidents</desc>
  <defs>
    <style>
      .bg{fill:#f7fbff}
      .box{fill:#fff;stroke:#cfdcef;stroke-width:2;rx:14;ry:14}
      .bad{fill:#fff2f2;stroke:#e8b0b0}
      .h{font:700 25px 'Pretendard','Segoe UI',sans-serif;fill:#23314e}
      .t{font:500 18px 'Pretendard','Segoe UI',sans-serif;fill:#334663}
      .m{font:700 16px 'JetBrains Mono',monospace;fill:#3659a7}
      .line{stroke:#7ea0da;stroke-width:3;fill:none;marker-end:url(#arr)}
    </style>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#7ea0da"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="680"/>
  <text x="70" y="74" class="h">What happened before policy tuning</text>

  <rect class="box" x="90" y="160" width="260" height="130"/>
  <text x="138" y="214" class="m">Client Requests</text>
  <text x="122" y="244" class="t">traffic spike begins</text>

  <rect class="box bad" x="470" y="160" width="260" height="130"/>
  <text x="515" y="214" class="m">Downstream API</text>
  <text x="504" y="244" class="t">latency + timeout</text>

  <rect class="box bad" x="850" y="160" width="260" height="130"/>
  <text x="905" y="214" class="m">Retry Storm</text>
  <text x="885" y="244" class="t">more pressure created</text>

  <path class="line" d="M350 225 L470 225"/>
  <path class="line" d="M730 225 L850 225"/>

  <rect class="box" x="90" y="370" width="1020" height="230"/>
  <text x="126" y="432" class="m">Observed symptoms</text>
  <text x="126" y="466" class="t">- p95/p99 latency jumps quickly</text>
  <text x="126" y="500" class="t">- worker threads hold longer than expected</text>
  <text x="126" y="534" class="t">- retries increase total call volume and delay recovery</text>
</svg>
