<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
  <title id="t">Resilience4j Config Mapping</title>
  <desc id="d">How config values map to runtime behavior</desc>
  <defs>
    <style>
      .bg{fill:#f6faff}
      .box{fill:#fff;stroke:#cfdcef;stroke-width:2;rx:14;ry:14}
      .h{font:700 25px 'Pretendard','Segoe UI',sans-serif;fill:#23314e}
      .t{font:500 18px 'Pretendard','Segoe UI',sans-serif;fill:#334663}
      .m{font:700 16px 'JetBrains Mono',monospace;fill:#3659a7}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="700"/>
  <text x="70" y="74" class="h">Key Resilience4j settings and what they affect</text>

  <rect class="box" x="80" y="130" width="1040" height="500"/>

  <text x="116" y="196" class="m">failureRateThreshold</text>
  <text x="456" y="196" class="t">Open the circuit when failure percentage exceeds this threshold.</text>

  <text x="116" y="256" class="m">slowCallRateThreshold</text>
  <text x="456" y="256" class="t">Open when too many calls are classified as slow.</text>

  <text x="116" y="316" class="m">slowCallDurationThreshold</text>
  <text x="456" y="316" class="t">Boundary for deciding whether a call is slow.</text>

  <text x="116" y="376" class="m">waitDurationInOpenState</text>
  <text x="456" y="376" class="t">How long to stay OPEN before trying HALF_OPEN probes.</text>

  <text x="116" y="436" class="m">permittedNumberOfCallsInHalfOpenState</text>
  <text x="456" y="436" class="t">Number of test calls allowed in HALF_OPEN.</text>

  <text x="116" y="496" class="m">minimumNumberOfCalls</text>
  <text x="456" y="496" class="t">Minimum sample size before calculating failure/slow rates.</text>

  <text x="116" y="556" class="m">slidingWindowSize / slidingWindowType</text>
  <text x="456" y="556" class="t">How metrics are aggregated (count-based or time-based window).</text>
</svg>
