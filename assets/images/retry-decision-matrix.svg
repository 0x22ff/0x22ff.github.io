<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
  <title id="t">Retry 판단 매트릭스</title>
  <desc id="d">재시도할 실패와 바로 실패시킬 실패를 구분하는 기준</desc>
  <defs>
    <style>
      .bg{fill:#f7fbff}
      .box{fill:#fff;stroke:#cfdcef;stroke-width:2;rx:14;ry:14}
      .h{font:700 25px 'Pretendard','Segoe UI',sans-serif;fill:#23314e}
      .t{font:500 18px 'Pretendard','Segoe UI',sans-serif;fill:#334663}
      .m{font:700 18px 'Pretendard','Segoe UI',sans-serif;fill:#3659a7}
      .ok{fill:#eaf8ef;stroke:#b8dfc7}
      .no{fill:#fff2f2;stroke:#e8b0b0}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="700"/>
  <text x="70" y="74" class="h">Retry 판단 매트릭스</text>

  <rect class="box ok" x="80" y="140" width="500" height="220"/>
  <text x="116" y="198" class="m">Retry 후보</text>
  <text x="116" y="236" class="t">- 네트워크 timeout</text>
  <text x="116" y="268" class="t">- 다운스트림 일시적 5xx</text>
  <text x="116" y="300" class="t">- connection reset 같은 일시 장애</text>

  <rect class="box no" x="620" y="140" width="500" height="220"/>
  <text x="656" y="198" class="m">Fail-fast 후보</text>
  <text x="656" y="236" class="t">- 검증/비즈니스 오류(4xx)</text>
  <text x="656" y="268" class="t">- idempotency key 없는 쓰기 요청</text>
  <text x="656" y="300" class="t">- 원인이 명확한 애플리케이션 예외</text>

  <rect class="box" x="80" y="410" width="1040" height="220"/>
  <text x="116" y="470" class="m">운영 기준</text>
  <text x="116" y="506" class="t">요청이 멱등적이고, 실패가 일시적일 가능성이 높을 때만 retry를 건다.</text>
  <text x="116" y="540" class="t">그 외에는 retry가 호출 수만 늘리고 복구를 더 늦출 수 있다.</text>
</svg>
