<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
  <title id="t">Retry Decision Matrix</title>
  <desc id="d">Which errors should be retried and which should fail fast</desc>
  <defs>
    <style>
      .bg{fill:#f7fbff}
      .box{fill:#fff;stroke:#cfdcef;stroke-width:2;rx:14;ry:14}
      .h{font:700 25px 'Pretendard','Segoe UI',sans-serif;fill:#23314e}
      .t{font:500 18px 'Pretendard','Segoe UI',sans-serif;fill:#334663}
      .m{font:700 16px 'JetBrains Mono',monospace;fill:#3659a7}
      .ok{fill:#eaf8ef;stroke:#b8dfc7}
      .no{fill:#fff2f2;stroke:#e8b0b0}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="700"/>
  <text x="70" y="74" class="h">Retry decision matrix (operational rule)</text>

  <rect class="box ok" x="80" y="140" width="500" height="220"/>
  <text x="116" y="198" class="m">Retry candidates</text>
  <text x="116" y="236" class="t">- network timeout</text>
  <text x="116" y="268" class="t">- 5xx from downstream</text>
  <text x="116" y="300" class="t">- temporary connection reset</text>

  <rect class="box no" x="620" y="140" width="500" height="220"/>
  <text x="656" y="198" class="m">Fail-fast candidates</text>
  <text x="656" y="236" class="t">- validation/business errors (4xx)</text>
  <text x="656" y="268" class="t">- non-idempotent write without idempotency key</text>
  <text x="656" y="300" class="t">- known deterministic application exception</text>

  <rect class="box" x="80" y="410" width="1040" height="220"/>
  <text x="116" y="470" class="m">Rule of thumb</text>
  <text x="116" y="506" class="t">Retry only when request is idempotent and failure is likely transient.</text>
  <text x="116" y="540" class="t">Otherwise retry may amplify load and delay recovery.</text>
</svg>
