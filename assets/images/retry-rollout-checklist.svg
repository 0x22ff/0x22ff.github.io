<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
  <title id="t">Retry와 Timeout 롤아웃 체크리스트</title>
  <desc id="d">재시도와 timeout 정책을 운영에 안전하게 올릴 때 보는 순서</desc>
  <defs>
    <style>
      .bg{fill:#f7fbff}
      .box{fill:#fff;stroke:#cfdcef;stroke-width:2;rx:14;ry:14}
      .h{font:700 25px 'Pretendard','Segoe UI',sans-serif;fill:#23314e}
      .t{font:500 18px 'Pretendard','Segoe UI',sans-serif;fill:#334663}
      .m{font:700 18px 'Pretendard','Segoe UI',sans-serif;fill:#3659a7}
      .line{stroke:#7ea0da;stroke-width:3;fill:none;marker-end:url(#arr)}
    </style>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#7ea0da"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="680"/>
  <text x="70" y="74" class="h">Retry + Timeout 롤아웃 순서</text>

  <rect class="box" x="80" y="140" width="230" height="120"/>
  <text x="112" y="190" class="m">1단계</text>
  <text x="112" y="220" class="t">멱등성 확인</text>

  <rect class="box" x="350" y="140" width="230" height="120"/>
  <text x="382" y="190" class="m">2단계</text>
  <text x="382" y="220" class="t">예외 정책 고정</text>

  <rect class="box" x="620" y="140" width="230" height="120"/>
  <text x="652" y="190" class="m">3단계</text>
  <text x="652" y="220" class="t">지표 + 알람</text>

  <rect class="box" x="890" y="140" width="230" height="120"/>
  <text x="922" y="190" class="m">4단계</text>
  <text x="922" y="220" class="t">점진 적용</text>

  <path class="line" d="M310 200 L350 200"/>
  <path class="line" d="M580 200 L620 200"/>
  <path class="line" d="M850 200 L890 200"/>

  <rect class="box" x="80" y="340" width="1040" height="260"/>
  <text x="116" y="398" class="m">전체 적용 전 확인</text>
  <text x="116" y="432" class="t">- fallback 응답 계약이 클라이언트와 맞는지 확인</text>
  <text x="116" y="466" class="t">- retry 횟수와 timeout이 SLO budget 안에 드는지 계산</text>
  <text x="116" y="500" class="t">- retry를 빨리 끌 수 있는 runbook을 같이 준비</text>
  <text x="116" y="534" class="t">- 다운스트림 rate limit을 다시 봐서 호출 증폭을 막는다</text>
</svg>
