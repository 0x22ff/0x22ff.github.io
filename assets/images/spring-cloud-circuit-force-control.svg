<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
  <title id="t">Spring Cloud based Forced Circuit Control</title>
  <desc id="d">Control circuit mode via Spring Cloud Config and refresh</desc>
  <defs>
    <style>
      .bg{fill:#f7fbff}
      .box{fill:#fff;stroke:#cedaee;stroke-width:2;rx:14;ry:14}
      .h{font:700 25px 'Pretendard','Segoe UI',sans-serif;fill:#23314e}
      .t{font:500 18px 'Pretendard','Segoe UI',sans-serif;fill:#334663}
      .m{font:700 16px 'JetBrains Mono',monospace;fill:#3659a7}
      .line{stroke:#7ea0da;stroke-width:3;fill:none;marker-end:url(#arr)}
    </style>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#7ea0da"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="700"/>
  <text x="70" y="74" class="h">Forced OPEN/CLOSE control with Spring Cloud</text>

  <rect class="box" x="90" y="150" width="260" height="120"/>
  <text x="140" y="198" class="m">Config Repo</text>
  <text x="118" y="228" class="t">ops.circuit.mode=...</text>

  <rect class="box" x="450" y="150" width="260" height="120"/>
  <text x="476" y="198" class="m">Config Server</text>
  <text x="484" y="228" class="t">serves properties</text>

  <rect class="box" x="810" y="150" width="300" height="120"/>
  <text x="852" y="198" class="m">Service Instance</text>
  <text x="848" y="228" class="t">@RefreshScope + Registry</text>

  <path class="line" d="M350 210 L450 210"/>
  <path class="line" d="M710 210 L810 210"/>

  <rect class="box" x="90" y="360" width="1020" height="230"/>
  <text x="126" y="422" class="m">Runtime flow</text>
  <text x="126" y="456" class="t">1) operator updates config value: AUTO / FORCED_OPEN / FORCED_CLOSED</text>
  <text x="126" y="490" class="t">2) call /actuator/refresh (or use Spring Cloud Bus)</text>
  <text x="126" y="524" class="t">3) service syncs circuit state using CircuitBreakerRegistry transition APIs</text>
  <text x="126" y="558" class="t">4) verify metrics and rollback mode when incident is resolved</text>
</svg>
